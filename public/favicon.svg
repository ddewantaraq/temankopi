<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#1C4431" />

  <!-- Orange Fruit (Top Right) -->
  <g id="fruit">
    <!-- Stem/Leaf -->
    <path d="M 370,105 C 385,85 410,88 410,88 C 410,88 395,112 370,105 Z" fill="#B3D0B0" />
    <!-- Orange Circle Base -->
    <circle cx="365" cy="148" r="42" fill="#D95C27" stroke="#1A1A1A" stroke-width="3" />
    <!-- Small Highlight Dot -->
    <circle cx="350" cy="138" r="8" fill="#E8CDA1" stroke="#1A1A1A" stroke-width="2" />
  </g>

  <!-- Large Leaf (Bottom Left) -->
  <g id="leaf">
    <!-- Leaf Base Outline -->
    <path d="M 0,310 C 130,310 160,420 135,512 L 0,512 Z" fill="#F4EFE0" stroke="#1A1A1A" stroke-width="3" />
    
    <!-- Central Main Stem -->
    <path d="M 46,512 C 75,410 110,345 110,345" stroke="#1C4431" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Leaf Veins -->
    <path d="M 72,425 C 50,400 30,390 15,385" stroke="#1C4431" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 85,380 C 65,360 40,350 25,345" stroke="#1C4431" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 80,440 C 105,420 125,415 140,412" stroke="#1C4431" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M 90,395 C 115,380 130,375 145,370" stroke="#1C4431" stroke-width="6" stroke-linecap="round" fill="none" />
  </g>
</svg>
